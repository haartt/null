<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; }
  html, body { height:100%; background:#000; overflow:hidden; }
  #pixelCanvas { display:block; width:100vw; height:100vh; cursor:none; }
  #err { position:fixed; top:10px; left:10px; color:red; font:14px monospace; z-index:10; white-space:pre-wrap; }
</style>
</head>
<body>
<canvas id="pixelCanvas"></canvas>
<div id="err"></div>
<script>
(() => {
  const IMG_SRC = 'artworkDark.png'; // relative path, same folder as this html
  const CELL = 24;
  const DECAY_MS = 400;
  const MAX_W = 1600; // downscale target

  const canvas = document.getElementById('pixelCanvas');
  const ctx = canvas.getContext('2d');
  const errBox = document.getElementById('err');

  let cols, rows, W, H, reveal, lastTick, small, smallCtx, img;
  let lastX, lastY;

  function fail(msg) {
    errBox.textContent = msg;
    console.error(msg);
  }

  function layout() {
    W = innerWidth;
    H = innerHeight;
    canvas.width = W;
    canvas.height = H;
    cols = Math.max(1, Math.ceil(W / CELL));
    rows = Math.max(1, Math.ceil(H / CELL));
    reveal = new Float32Array(cols * rows);
    lastTick = new Float32Array(cols * rows);
    small = document.createElement('canvas');
    small.width = cols;
    small.height = rows;
    smallCtx = small.getContext('2d');
    smallCtx.drawImage(img, 0, 0, cols, rows);
  }

  fetch(IMG_SRC)
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' fetching ' + IMG_SRC);
      return r.blob();
    })
    .then(blob => createImageBitmap(blob, { resizeWidth: MAX_W, resizeQuality: 'medium' }))
    .then(bitmap => {
      img = bitmap; // ImageBitmap works directly with drawImage
      img.naturalWidth = img.width;
      img.naturalHeight = img.height;
      layout();
      requestAnimationFrame(frame);
    })
    .catch(e => fail('Image load failed: ' + e.message + '\nCheck IMG_SRC path: ' + IMG_SRC));

  addEventListener('resize', () => { if (img) layout(); });

  function unlock(px, py) {
    lastX = px; lastY = py;
    if (!cols) return;
    const cx = px / CELL | 0, cy = py / CELL | 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const x = cx + dx, y = cy + dy;
        if (x < 0 || y < 0 || x >= cols || y >= rows) continue;
        const i = y * cols + x;
        reveal[i] = 1;
        lastTick[i] = performance.now();
      }
    }
  }

  canvas.addEventListener('pointermove', e => unlock(e.clientX, e.clientY));
  canvas.addEventListener('pointerleave', () => { lastX = undefined; });

  function frame(now) {
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(small, 0, 0, W, H);

    ctx.imageSmoothingEnabled = true;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        if (reveal[i] <= 0) continue;
        if (now - lastTick[i] > DECAY_MS) {
          reveal[i] -= 0.3;
          lastTick[i] = now;
        }
        if (reveal[i] <= 0) { reveal[i] = 0; continue; }
        ctx.save();
        ctx.globalAlpha = reveal[i];
        const sx = x / cols * img.naturalWidth;
        const sy = y / rows * img.naturalHeight;
        const sw = img.naturalWidth / cols;
        const sh = img.naturalHeight / rows;
        ctx.drawImage(img, sx, sy, sw, sh, x * CELL, y * CELL, CELL, CELL);
        ctx.restore();
      }
    }

    if (lastX !== undefined) {
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
